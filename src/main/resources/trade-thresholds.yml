# Large-trade alert thresholds: the minimum notional, in USDT, at which a sweep alerts.
# Imported by application.yml into screener.trade-alerts. A trade-thresholds.yml in the server's
# working directory overrides this file per property (restart to apply); maps merge, so it can
# change or add an override but cannot remove one from here: set it to the venue's default instead.
#
# Lookup per instrument: min-notional (venue + native symbol), else venue-default-min-notional,
# else default-min-notional.
#
# Policy (.claude/plans/trade-mexc-plan.md §2.8): a floor that marks a trade as large in absolute
# terms, the same on every exchange: $30K on spot, $100K on futures (leveraged, and far more volume).
# A thin symbol keeps the floor and alerts only when a large trade happens. A busy symbol gets the
# lowest step of 50K, 75K, 100K, 150K, 200K, 300K, 500K, 750K, 1M, 1.5M, 2M, 3M, 5M, ... at which it
# averages at most 3 alerts/h and stays at or under 7.5 in every full hour of the capture. Budget: about
# 120 alerts/h for the whole feed (derived: Binance spot 39, Binance futures 52, MEXC spot 3, MEXC
# futures 19). Derived by trade-capture/analysis/thresholds.py, which prints these blocks in this
# format, so a re-derived block replaces the old one as a whole.
#
# Captures: Binance 2026-11-17 15:00-20:44 UTC (5.1 h, US session); MEXC 2026-11-18 07:39-17:31 UTC
# (10.2 h, through the US open).
screener:
  trade-alerts:
    # Spot, on every exchange.
    default-min-notional: 30000

    # A venue's own default, between the symbol overrides and default-min-notional; optional.
    venue-default-min-notional:
      BINANCE_FUTURES: 100000
      MEXC_FUTURES: 100000

    # Per venue, per native symbol; optional. An override applies to its venue only.
    min-notional:
      BINANCE_SPOT:
        BTCUSDT: 750000
        ETHUSDT: 200000
        SOLUSDT: 150000
        BNBUSDT: 75000
        NEARUSDT: 75000
        ZECUSDT: 75000
        HYPEUSDT: 50000
        TRXUSDT: 50000
        UNIUSDT: 50000
        XRPUSDT: 50000
      BINANCE_FUTURES:
        BTCUSDT: 5000000
        ETHUSDT: 5000000
        SOLUSDT: 500000
        ZECUSDT: 500000
        HYPEUSDT: 300000
        XRPUSDT: 300000
        1000PEPEUSDT: 150000
        AAVEUSDT: 150000
        BNBUSDT: 150000
        DOGEUSDT: 150000
        NEARUSDT: 150000
        PENGUUSDT: 150000
        SUIUSDT: 150000
      MEXC_FUTURES:
        BTC_USDT: 2000000
        ETH_USDT: 1500000
        SOL_USDT: 500000
        XRP_USDT: 500000
        ZEC_USDT: 300000

#file: noinspection YAMLSchemaValidation
spring:
  application:
    name: screener-backend
  main:
    # CRITICAL: prevents spring-boot-starter-webflux from hijacking the server to Netty reactive.
    # WebFlux is on the classpath only for WebClient — the application runs on Tomcat/MVC.
    web-application-type: servlet

  datasource:
    url: "${DB_URL:}"
    username: "${DB_USER:}"
    password: "${DB_PASSWORD:}"
    hikari:
      maximum-pool-size: 10
      connection-timeout: 3000

  jpa:
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:}
    open-in-view: false

  mail:
    host: "${MAIL_HOST:}"
    port: "${MAIL_PORT:587}"
    username: "${MAIL_USERNAME:}"
    password: "${MAIL_PASSWORD:}"
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true

  task:
    scheduling:
      # Spring's default is a SINGLE thread shared by every @Scheduled method — the stats collector,
      # the ticker refresh, payment reconciliation and the CSV recorder. One slow disk write would
      # then delay payment reconciliation and the collector's sampling. Give them room.
      pool:
        size: 4

  flyway:
    enabled: ${SPRING_FLYWAY_ENABLED:}
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 4

screener:
  admin:
    emails: "${SCREENER_ADMIN_EMAILS:}"

  binance:
    spot-base-url: https://api.binance.com
    futures-base-url: https://fapi.binance.com
    codec-buffer-size-mb: 18
    # Binance hard limits: spot 6 000, futures 2 400.
    spot-weight-threshold: 5800
    futures-weight-threshold: 2200

  ticker:
    # ISO-8601 duration.
    refresh-interval: PT4H

  orderbook:
    # Price levels further than this fraction from the mid-price are discarded to bound memory.
    price-filter-threshold: 0.1
    # Snapshot dispatch rate per market (milliseconds).
    spot-snapshot-dispatch-rate-ms: 6000
    futures-snapshot-dispatch-rate-ms: 6000
    spot-snapshot-queue-size: 10
    futures-snapshot-queue-size: 10

  disruptor:
    shard-count: 2
    ring-buffer-size: 65536

  monitoring:
    orderbook:
      # How often each shard's consumer republishes its books' stats snapshot (hot-path cadence).
      publish-interval-ms: 1000
      # How often the collector samples published stats to derive rates.
      # Also the resolution of `idleMs` — keep it well below stale-threshold-ms.
      sample-interval-ms: 5000
      # How often a point is appended to the fleet trend ring. Decoupled from sample-interval-ms:
      # rates need a 5 s sample, an overnight trend does not, and the ring's JSON payload is what
      # gets expensive at long retention (2 880 points ≈ 600 KB; at 5 s it would be ~4 MB).
      history-interval-ms: 30000
      # EWMA half-life for the smoothed per-book update rate.
      rate-half-life-ms: 30000
      # Fleet history ring length in points. Retention = history-size × history-interval-ms
      # (2 880 × 30 s = 24 h). ~550 KB of heap.
      history-size: 2880
      # A SYNCED book with no diff for this long counts as stale. The quietest healthy books update
      # only every ~30 s, so a 30 s threshold flags illiquidity rather than faults — calibrate this
      # from the observed idleMs distribution (`/orderbook/books?sort=IDLE&order=DESC`).
      stale-threshold-ms: 120000
      # 0 = choose bin count by Freedman–Diaconis.
      default-histogram-bins: 0
      max-outliers-listed: 10
      # Periodic CSV capture to local disk. Off by default; turn on for long-horizon capacity runs.
      # Writes books-<date>.csv (per book per tick), fleet-<date>.csv (totals + heap) and
      # shards-<date>.csv (per-shard load). All long-format, all pandas-ready.
      recorder:
        enabled: ${SCREENER_RECORDER_ENABLED:false}
        # The bulky file: ~85 bytes per row, so ~85 KB per write at ~1 000 books. At 1 minute that
        # is ~120 MB/day, and the steady-state disk cost is retention-days × that — ~1.7 GB at 14
        # days. Sized against the deployment's disk, not its RAM: the write itself is ~0.5 MB of
        # short-lived garbage per tick on the scheduler pool, never the hot path.
        books-interval-ms: 60000
        # One row (~150 bytes) plus one per shard. Cheap, so it runs often — the resolution of the
        # usedHeapBytes-vs-totalLevels regression comes from here.
        fleet-interval-ms: 30000
        directory: ${SCREENER_RECORDER_DIR:/var/lib/screener/monitoring-data}
        # Delete captured files older than this. 0 disables the sweep — on a small disk, that is how
        # you eventually fill it.
        retention-days: 3
      max-books-returned: 2000

  classification:
    # Max (symbol, market) targets allowed in a single rule upsert/delete request — bounds
    # one transaction's size.
    max-targets-per-request: 200

  billing:
    # Free trial granted on registration (ISO-8601 duration).
    trial-duration: P7D
    # Default region for the stub RegionResolver (UZS / Uzbekistan). Real geo/phone resolution
    # is future work; nothing is persisted yet.
    default-currency: UZS
    default-country: UZ
    # How close to expiry a paid subscription must be before the user may buy another fixed plan
    # (ISO-8601 duration). A paid sub expiring further out than this is blocked from a redundant
    # fixed purchase; within this window it may renew. Pay-by-days ignores this.
    renewal-window: P5D

  payment:
    # How often the reconciliation sweep resolves stale PENDING orders (ISO-8601 duration).
    reconciliation-interval: PT1M
    multicard:
      # Sandbox by default; production is https://mesh.multicard.uz.
      base-url: https://dev-mesh.multicard.uz
      # Secrets supplied via environment variables, never committed.
      application-id: "${MULTICARD_APP_ID:}"
      secret: "${MULTICARD_SECRET:}"
      store-id: "${MULTICARD_STORE_ID:}"
      callback-url: "${MULTICARD_CALLBACK_URL:}"   # public URL of our callback endpoint
      return-url: "${MULTICARD_RETURN_URL:}"       # SPA post-payment landing page
      invoice-ttl: PT30M
      allowed-ip: 195.158.26.90
      lang: ru
      # Fiscalization. Env-overridable; production default true. NOTE: the buildOfd payload is still a
      # PLACEHOLDER (no real mxik/package_code tax data) — enabling this against a production merchant
      # agreement sends incomplete fiscal data. A go-to-production dependency. application-local.yml forces
      # this false (sandbox accepts invoices without ofd).
      ofd-enabled: ${MULTICARD_OFD_ENABLED:true}

  websocket:
    spot-stream-url: wss://stream.binance.com/ws
    futures-stream-url: wss://fstream.binance.com/ws
    connection-count-spot: 2
    connection-count-futures: 3
    subscribe-chunk-size: 400
    reconnect-initial-delay-ms: 100
    reconnect-max-delay-ms: 30000
    # How often to send a WebSocket PING to Binance to prevent server-side idle close (1006).
    heartbeat-interval-seconds: 120

  jwt:
    secret: "${JWT_SECRET:}"
    access-token-expiry: PT3H
    refresh-token-expiry: P7D

  email:
    from-address: "${MAIL_FROM:noreply@tc-screener.com}"
    from-name: "TC Screener"
    verification-token-expiry: PT24H
    resend-cooldown: PT1M
    # SPA email-verification page. The email link points here carrying ?token=<raw>; the page shows a
    # Confirm button that POSTs the token to /api/auth/verify-email. Loading the page consumes nothing,
    # so passive link scanners can't burn the single-use token before the human clicks Confirm.
    verify-page-url: "${EMAIL_VERIFY_PAGE_URL:}"

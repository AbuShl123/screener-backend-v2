#file: noinspection YAMLSchemaValidation
spring:
  application:
    name: screener-backend
  main:
    # CRITICAL: prevents spring-boot-starter-webflux from hijacking the server to Netty reactive.
    # WebFlux is on the classpath only for WebClient — the application runs on Tomcat/MVC.
    web-application-type: servlet

  datasource:
    url: "${DB_URL:}"
    username: "${DB_USER:}"
    password: "${DB_PASSWORD:}"
    hikari:
      maximum-pool-size: 10
      connection-timeout: 3000

  jpa:
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:}
    open-in-view: false

  mail:
    host: "${MAIL_HOST:}"
    port: "${MAIL_PORT:587}"
    username: "${MAIL_USERNAME:}"
    password: "${MAIL_PASSWORD:}"
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true

  flyway:
    enabled: ${SPRING_FLYWAY_ENABLED:}
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 4

screener:
  admin:
    emails: "${SCREENER_ADMIN_EMAILS:}"

  exchanges:
    binance:
      enabled: ${BINANCE_ENABLED:true}
      # Core snapshot request queue, one per Binance venue, all shaped alike. max-batch-size also
      # caps how many books buffer diffs at once. batch-timeout is a safety net for a batch that
      # never completes and must exceed every venue's rest.response-timeout.
      snapshot-queue:
        max-batch-size: 10
        flush-interval: PT0.25S
        batch-timeout: PT30S
      venues:
        SPOT:
          rest:
            base-url: https://api.binance.com
            codec-buffer-size-mb: 18
            connect-timeout: PT5S
            response-timeout: PT10S
          # How Binance prices and paces this venue's snapshot requests. depth-limit must be 100,
          # 500 or 1000. weight-reserve is left unspent for discovery calls, which the snapshot
          # fetcher does not see. ban-fallback applies to a 418 without Retry-After.
          snapshot:
            depth-limit: 1000
            weight-limit-per-minute: 6000
            weight-reserve: 200
            ban-fallback: PT2M
          stream-url: wss://stream.binance.com/ws
          stream-topic: "{symbol}@depth"
          max-streams-per-connection: 1024
          min-connections: 2
          max-connections: 8
          subscribe-chunk-size: 400
          heartbeat-interval-seconds: 120
        FUTURES:
          rest:
            base-url: https://fapi.binance.com
            codec-buffer-size-mb: 18
            connect-timeout: PT5S
            response-timeout: PT10S
          snapshot:
            depth-limit: 1000
            weight-limit-per-minute: 2400
            weight-reserve: 200
            ban-fallback: PT2M
          stream-url: wss://fstream.binance.com/ws
          stream-topic: "{symbol}@depth@500ms"
          max-streams-per-connection: 1024
          min-connections: 3
          max-connections: 8
          subscribe-chunk-size: 400
          heartbeat-interval-seconds: 120

    mexc:
      # Futures only — MEXC spot streams Protobuf and has no adapter. Dark until the adapter is
      # complete (.claude/plans/mexc-impl-plan.md, Phase 5): enabling it earlier fails startup,
      # because MEXC_FUTURES has no stream protocol bound yet. snapshot-queue arrives with Phase 4b.
      enabled: ${MEXC_ENABLED:false}
      venues:
        FUTURES:
          rest:
            base-url: https://api.mexc.com
            # /api/v1/contract/detail is ~2.3 MB for ~1100 contracts (measured 2026-10-04).
            codec-buffer-size-mb: 8
            connect-timeout: PT5S
            response-timeout: PT10S
          stream-url: wss://contract.mexc.com/edge
          # The symbol travels inside the sub.depth frame's param, so the topic is the bare symbol.
          stream-topic: "{symbol}"
          # No per-connection cap observed (1106 on one socket). ~300 keeps one dropped socket from
          # resyncing every MEXC book at once.
          max-streams-per-connection: 300
          min-connections: 1
          max-connections: 8
          # sub.depth takes one symbol per frame.
          subscribe-chunk-size: 1
          # MEXC disconnects after 60s without a ping; docs recommend 10–20s.
          heartbeat-interval-seconds: 15

  discovery:
    # Per-source wait on each universe refresh. A source that overruns is cancelled and its venues
    # keep their previous universe (no removals).
    source-timeout: PT30S
    # Never tracked on any exchange or market: stablecoin / metal pairs whose books carry no signal.
    # Written as base + quote (USDCUSDT), never an exchange's native form (MEXC's USDC_USDT).
    # Eligibility itself (quote asset, contract type, status) is hardcoded in each adapter.
    excluded-symbols:
      - USDCUSDT
      - FDUSDUSDT
      - DAIUSDT
      - PYUSDUSDT
      - USD1USDT
      - XAUTUSDT
      - PAXGUSDT

  ticker:
    refresh-interval: PT4H

  orderbook:
    # Price levels further than this fraction from the mid-price are discarded to bound memory.
    price-filter-threshold: 0.1

  disruptor:
    shard-count: 2
    ring-buffer-size: 65536

  classification:
    # Max (symbol, market) targets allowed in a single rule upsert/delete request — bounds
    # one transaction's size.
    max-targets-per-request: 200

  billing:
    # Free trial granted on registration (ISO-8601 duration).
    trial-duration: P7D
    # Default region for the stub RegionResolver (UZS / Uzbekistan). Real geo/phone resolution
    # is future work; nothing is persisted yet.
    default-currency: UZS
    default-country: UZ
    # How close to expiry a paid subscription must be before the user may buy another fixed plan
    # (ISO-8601 duration). A paid sub expiring further out than this is blocked from a redundant
    # fixed purchase; within this window it may renew. Pay-by-days ignores this.
    renewal-window: P5D

  payment:
    # How often the reconciliation sweep resolves stale PENDING orders (ISO-8601 duration).
    reconciliation-interval: PT1M
    multicard:
      # Sandbox by default; production is https://mesh.multicard.uz.
      base-url: https://dev-mesh.multicard.uz
      # Secrets supplied via environment variables, never committed.
      application-id: "${MULTICARD_APP_ID:}"
      secret: "${MULTICARD_SECRET:}"
      store-id: "${MULTICARD_STORE_ID:}"
      callback-url: "${MULTICARD_CALLBACK_URL:}"   # public URL of our callback endpoint
      return-url: "${MULTICARD_RETURN_URL:}"       # SPA post-payment landing page
      invoice-ttl: PT30M
      allowed-ip: 195.158.26.90
      lang: ru
      # Fiscalization. Env-overridable; production default true. NOTE: the buildOfd payload is still a
      # PLACEHOLDER (no real mxik/package_code tax data) — enabling this against a production merchant
      # agreement sends incomplete fiscal data. A go-to-production dependency. application-local.yml forces
      # this false (sandbox accepts invoices without ofd).
      ofd-enabled: ${MULTICARD_OFD_ENABLED:true}

  websocket:
    reconnect-initial-delay-ms: 100
    reconnect-max-delay-ms: 30000

  jwt:
    secret: "${JWT_SECRET:}"
    access-token-expiry: PT3H
    refresh-token-expiry: P7D

  email:
    from-address: "${MAIL_FROM:noreply@tc-screener.com}"
    from-name: "TC Screener"
    verification-token-expiry: PT24H
    resend-cooldown: PT1M
    # SPA email-verification page. The email link points here carrying ?token=<raw>; the page shows a
    # Confirm button that POSTs the token to /api/auth/verify-email. Loading the page consumes nothing,
    # so passive link scanners can't burn the single-use token before the human clicks Confirm.
    verify-page-url: "${EMAIL_VERIFY_PAGE_URL:}"

#file: noinspection YAMLSchemaValidation
spring:
  application:
    name: screener-backend
  main:
    # CRITICAL: prevents spring-boot-starter-webflux from hijacking the server to Netty reactive.
    # WebFlux is on the classpath only for WebClient — the application runs on Tomcat/MVC.
    web-application-type: servlet

  datasource:
    url: "${DB_URL:}"
    username: "${DB_USER:}"
    password: "${DB_PASSWORD:}"
    hikari:
      maximum-pool-size: 10
      connection-timeout: 3000

  jpa:
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:}
    open-in-view: false

  mail:
    host: "${MAIL_HOST:}"
    port: "${MAIL_PORT:587}"
    username: "${MAIL_USERNAME:}"
    password: "${MAIL_PASSWORD:}"
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true

  flyway:
    enabled: ${SPRING_FLYWAY_ENABLED:}
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 4

screener:
  admin:
    emails: "${SCREENER_ADMIN_EMAILS:}"

  exchanges:
    binance:
      enabled: ${BINANCE_ENABLED:true}
      snapshot-queue:
        max-batch-size: 10
        flush-interval: PT0.25S
        batch-timeout: PT30S
      venues:
        SPOT:
          enabled: ${BINANCE_SPOT_ENABLED:true}
          rest:
            base-url: https://api.binance.com
            codec-buffer-size-mb: 18
            connect-timeout: PT5S
            response-timeout: PT10S
          snapshot:
            # acceptable values: 100, 500, 1000
            depth-limit: 1000
            weight-limit-per-minute: 6000
            weight-reserve: 200
            ban-fallback: PT2M
          streams:
            DEPTH:
              stream-url: wss://stream.binance.com/ws
              max-streams-per-connection: 1024
              min-connections: 2
              max-connections: 8
              subscribe-chunk-size: 400
              heartbeat-interval-seconds: 120
            TRADE:
              enabled: ${BINANCE_SPOT_TRADE_ENABLED:true}
              stream-url: wss://stream.binance.com/ws
              max-streams-per-connection: 1024
              min-connections: 1
              max-connections: 2
              subscribe-chunk-size: 400
              heartbeat-interval-seconds: 120
        FUTURES:
          enabled: ${BINANCE_FUTURES_ENABLED:true}
          rest:
            base-url: https://fapi.binance.com
            codec-buffer-size-mb: 18
            connect-timeout: PT5S
            response-timeout: PT10S
          snapshot:
            depth-limit: 1000
            weight-limit-per-minute: 2400
            weight-reserve: 200
            ban-fallback: PT2M
          streams:
            # Futures streams are routed by URL path. A stream on the wrong path is acked and then stays
            # silent (no error frame), so a wrong URL shows up only as 0 frames/s in the health log.
            DEPTH:
              stream-url: wss://fstream.binance.com/public/ws
              max-streams-per-connection: 1024
              min-connections: 3
              max-connections: 8
              subscribe-chunk-size: 400
              heartbeat-interval-seconds: 120
            TRADE:
              enabled: ${BINANCE_FUTURES_TRADE_ENABLED:true}
              # aggTrade is served only on /market; on /public or legacy /ws it is acked and stays silent.
              stream-url: wss://fstream.binance.com/market/ws
              max-streams-per-connection: 1024
              min-connections: 1
              max-connections: 2
              subscribe-chunk-size: 400
              heartbeat-interval-seconds: 120

    mexc:
      enabled: ${MEXC_ENABLED:false}
      snapshot-queue:
        max-batch-size: 12
        flush-interval: PT0.25S
        batch-timeout: PT20S
      venues:
        SPOT:
          enabled: ${MEXC_SPOT_ENABLED:true}
          rest:
            base-url: https://api.mexc.com
            codec-buffer-size-mb: 8
            connect-timeout: PT5S
            response-timeout: PT10S
          snapshot:
            depth-limit: 2000
            request-interval: PT0.1S
            waf-cooldown: PT90S
          max-visible-distance: 0.01
          streams:
            DEPTH:
              stream-url: wss://wbs-api.mexc.com/ws
              # The server allows 30 subscriptions per connection, so max-connections must cover
              # universe / 30 (~549 pairs → 19).
              max-streams-per-connection: 30
              min-connections: 1
              max-connections: 30
              subscribe-chunk-size: 30
              heartbeat-interval-seconds: 20
        FUTURES:
          enabled: ${MEXC_FUTURES_ENABLED:true}
          rest:
            base-url: https://api.mexc.com
            codec-buffer-size-mb: 8
            connect-timeout: PT5S
            response-timeout: PT10S
          snapshot:
            depth-limit: 1500
            request-interval: PT0.25S
            throttle-cooldown: PT3S
            waf-cooldown: PT90S
          max-visible-distance: 0.01
          streams:
            DEPTH:
              stream-url: wss://contract.mexc.com/edge
              max-streams-per-connection: 300
              min-connections: 1
              max-connections: 8
              subscribe-chunk-size: 1
              heartbeat-interval-seconds: 15

    bybit:
      enabled: ${BYBIT_ENABLED:true}
      # REST snapshots are only a safety net for a mid-stream gap: cold start and reconnects sync
      # from the in-stream snapshot. batch-timeout must exceed max-batch-size × request-interval +
      # rest.response-timeout (10 × 0.1s + 10s = 11s).
      snapshot-queue:
        max-batch-size: 10
        flush-interval: PT0.25S
        batch-timeout: PT20S
      # Bybit's REST limit is per IP and shared by both venues (600 req / 5 s; breaking it is an
      # HTTP 403 and a 10-minute ban), so one pause stops both venues' snapshot requests.
      snapshot-cooldown:
        rate-limited: PT10S   # retCode 10006 / 10018 in an HTTP 200, or an HTTP 429
        banned: PT10M         # HTTP 403
      venues:
        SPOT:
          enabled: ${BYBIT_SPOT_ENABLED:true}
          rest:
            base-url: https://api.bybit.com
            codec-buffer-size-mb: 8
            connect-timeout: PT5S
            response-timeout: PT10S
          snapshot:
            # 10 req/s per venue, 20 together: a sixth of the 120 req/s budget.
            request-interval: PT0.1S
          streams:
            DEPTH:
              stream-url: wss://stream.bybit.com/v5/public/spot
              # No per-connection topic cap observed (566 spot topics on one connection were acked).
              max-streams-per-connection: 300
              min-connections: 2
              max-connections: 8
              # Hard server limit: a spot subscribe frame takes at most 10 args.
              subscribe-chunk-size: 10
              heartbeat-interval-seconds: 20
        FUTURES:
          enabled: ${BYBIT_FUTURES_ENABLED:true}
          rest:
            base-url: https://api.bybit.com
            codec-buffer-size-mb: 8
            connect-timeout: PT5S
            response-timeout: PT10S
          snapshot:
            request-interval: PT0.1S
          streams:
            DEPTH:
              stream-url: wss://stream.bybit.com/v5/public/linear
              max-streams-per-connection: 300
              min-connections: 2
              max-connections: 8
              # No arg-count cap on linear, but the args array must stay under 21 000 chars or the
              # server closes the connection (1009); 200 topics stay well under it.
              subscribe-chunk-size: 200
              heartbeat-interval-seconds: 20

  discovery:
    source-timeout: PT30S
    excluded-symbols:
      - USDCUSDT
      - FDUSDUSDT
      - DAIUSDT
      - PYUSDUSDT
      - USD1USDT
      - XAUTUSDT
      - PAXGUSDT
      - RLUSDUSDT
      - USDEUSDT

  # Large-trade detection (.claude/plans/trade-detection-plan.md §2.5). Notional in quote currency
  # (USDT on Binance). Values from the slice 0 capture (§10.2): a $30K floor; a symbol whose alert
  # rate at the floor is above ~10/h gets the lowest step of 50K, 75K, 100K, 150K, 200K, 300K,
  # 500K, ..., 5M that brings it to 10/h or less.
  trade-alerts:
    default-min-notional: 30000
    min-notional:                        # per venue, per native symbol; optional
      BINANCE_SPOT:
        BTCUSDT: 500000
        ETHUSDT: 200000
        SOLUSDT: 150000
        BNBUSDT: 75000
        NEARUSDT: 50000
        XRPUSDT: 50000
        ZECUSDT: 50000
      BINANCE_FUTURES:
        BTCUSDT: 5000000
        ETHUSDT: 3000000
        SOLUSDT: 500000
        ZECUSDT: 300000
        HYPEUSDT: 200000
        XRPUSDT: 200000
        1000PEPEUSDT: 150000
        AAVEUSDT: 150000
        BNBUSDT: 150000
        NEARUSDT: 150000
        DOGEUSDT: 100000
        ADAUSDT: 75000
        AVAXUSDT: 75000
        ENAUSDT: 75000
        GRAMUSDT: 75000
        LINKUSDT: 75000
        SUIUSDT: 75000
        UNIUSDT: 75000
        ASTERUSDT: 50000
        BCHUSDT: 50000
        BREVUSDT: 50000
        FILUSDT: 50000
        INJUSDT: 50000
        MMTUSDT: 50000
        PENGUUSDT: 50000
        PUMPUSDT: 50000
        TRUMPUSDT: 50000
        WLDUSDT: 50000
    recent-capacity: 500                 # alerts kept in memory for /api/monitoring/trade-alerts
    replay-size: 100                     # alerts replayed in every /ws SNAPSHOT

  ticker:
    refresh-interval: PT4H

  orderbook:
    # Price levels further than this fraction from the mid-price are discarded to bound memory.
    price-filter-threshold: 0.1

  disruptor:
    shard-count: 2
    ring-buffer-size: 65536

  classification:
    # Max (symbol, market) targets allowed in a single rule upsert/delete request — bounds
    # one transaction's size.
    max-targets-per-request: 200

  billing:
    # Free trial granted on registration (ISO-8601 duration).
    trial-duration: P7D
    # Default region for the stub RegionResolver (UZS / Uzbekistan). Real geo/phone resolution
    # is future work; nothing is persisted yet.
    default-currency: UZS
    default-country: UZ
    # How close to expiry a paid subscription must be before the user may buy another fixed plan
    # (ISO-8601 duration). A paid sub expiring further out than this is blocked from a redundant
    # fixed purchase; within this window it may renew. Pay-by-days ignores this.
    renewal-window: P5D

  payment:
    # How often the reconciliation sweep resolves stale PENDING orders (ISO-8601 duration).
    reconciliation-interval: PT1M
    multicard:
      # Sandbox by default; production is https://mesh.multicard.uz.
      base-url: https://dev-mesh.multicard.uz
      # Secrets supplied via environment variables, never committed.
      application-id: "${MULTICARD_APP_ID:}"
      secret: "${MULTICARD_SECRET:}"
      store-id: "${MULTICARD_STORE_ID:}"
      callback-url: "${MULTICARD_CALLBACK_URL:}"   # public URL of our callback endpoint
      return-url: "${MULTICARD_RETURN_URL:}"       # SPA post-payment landing page
      invoice-ttl: PT30M
      allowed-ip: 195.158.26.90
      lang: ru
      # Fiscalization. Env-overridable; production default true. NOTE: the buildOfd payload is still a
      # PLACEHOLDER (no real mxik/package_code tax data) — enabling this against a production merchant
      # agreement sends incomplete fiscal data. A go-to-production dependency. application-local.yml forces
      # this false (sandbox accepts invoices without ofd).
      ofd-enabled: ${MULTICARD_OFD_ENABLED:true}

  websocket:
    reconnect-initial-delay-ms: 100
    reconnect-max-delay-ms: 30000

  jwt:
    secret: "${JWT_SECRET:}"
    access-token-expiry: PT3H
    refresh-token-expiry: P7D

  email:
    from-address: "${MAIL_FROM:noreply@tc-screener.com}"
    from-name: "TC Screener"
    verification-token-expiry: PT24H
    resend-cooldown: PT1M
    # SPA email-verification page. The email link points here carrying ?token=<raw>; the page shows a
    # Confirm button that POSTs the token to /api/auth/verify-email. Loading the page consumes nothing,
    # so passive link scanners can't burn the single-use token before the human clicks Confirm.
    verify-page-url: "${EMAIL_VERIFY_PAGE_URL:}"
    # False registers accounts as already verified (no token, no email) — for local dev without
    # SMTP credentials only. Never disable in production.
    verification-required: ${EMAIL_VERIFICATION_REQUIRED:true}
